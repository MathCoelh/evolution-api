# IT Squad: monta a imagem Docker da branch itsquad-lid no GitHub (não na VPS)
# e publica em ghcr.io/mathcoelh/evolution-api:2.3.7-itsquad.
name: Imagem IT Squad

on:
  push:
    branches: [itsquad-lid]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mathcoelh/evolution-api:2.3.7-itsquad
            ghcr.io/mathcoelh/evolution-api:itsquad-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
